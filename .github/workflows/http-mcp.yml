name: HTTP MCP checks
on:
  push:
    paths:
      - 'http-mcp/**'
      - '.github/workflows/http-mcp.yml'
  pull_request:
    paths:
      - 'http-mcp/**'
      - '.github/workflows/http-mcp.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: http-mcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - run: make check
